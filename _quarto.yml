project:
  type: website
  output-dir: _site
  resources:
    - papers/
    - assets/img/
    - assets/js/
    - CNAME

website:
  title: "Maximilian W. Müller"
  site-url: "https://www.maximilianwmueller.com"
  description: "Behavioural economist at the Toulouse School of Economics, working on social influence, aspirations, and memory."
  favicon: assets/img/favicon.png
  open-graph: true
  twitter-card: false

  search: false
  navbar:
    background: light
    title: "Maximilian W. Müller"
    left:
      - href: index.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: cv.qmd
        text: CV
      - href: off-the-clock.qmd
        text: Off the clock

  page-footer:
    left: "Toulouse School of Economics"
    right: "[maximilian.muller@tse-fr.eu](mailto:maximilian.muller@tse-fr.eu)"

format:
  html:
    theme: [cosmo, assets/css/theme.scss]
    css: assets/css/styles.css
    grid:
      body-width: 620px
      sidebar-width: 0px
      margin-width: 0px
    toc: false
    anchor-sections: false
    link-external-newwindow: false
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

execute:
  freeze: auto
